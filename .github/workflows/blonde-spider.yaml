name: Build AAB Durioo Fire TV
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to clone'
        required: false
        default: 'fire-tv-prod'

jobs:
  build_aab:
    runs-on: ubuntu-latest
    steps:
      - name: Load Remote ENV from Protected JSON
        uses: subekti404dev/gha-json-env@v1
        with:
          url: ${{ secrets.ENV_URL }}
          token: ${{ secrets.ENV_TOKEN }}

      - name: Decode SSH key
        id: decode_key
        run: |
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "${{ env.durioo_builder_b64_ssh_key }}" | base64 -d >> $GITHUB_OUTPUT
          echo >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ steps.decode_key.outputs.key }}

      - name: Clone Repo
        run: git clone -b ${{ github.event.inputs.branch }} ${{ env.durioo_builder_repo_mobile }}

      - name: Install Utilities
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo sh - 
          sudo apt-get install -y nodejs
          sudo npm install -g eas-cli@latest
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure .expo directory exists
        run: mkdir -p ~/.expo

      - name: Write EXPO_TOKEN (base64 decoded) to ~/.expo/state.json
        run: |
          mkdir -p ~/.expo
          echo "${{ env.durioo_builder_expo_token }}" | base64 -d > ~/.expo/state.json


      - name: Install Deps
        run: cd duriooplus-mobile-v2/ && yarn

      - name: Build aab
        run: cd duriooplus-mobile-v2/ && yarn build-prod-tv-firetv --local --output durioo.aab
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: Check Dir
        run: ls -lah

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: durioo-aab
          path: 'duriooplus-mobile-v2/durioo.aab'

      - name: Send AAB to Telegram
        run: |
          FILE='duriooplus-mobile-v2/durioo.aab'
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${{ env.torent_downloader_telegram_bot_token }}/sendDocument" \
            -F chat_id="${{ env.torent_downloader_telegram_chat_id }}" \
            -F document=@"$FILE" \
            -F caption="📦 ${FILE##*/} — ${{ github.ref_name }} #${{ github.run_number }}"
